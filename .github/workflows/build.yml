name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Each architecture builds and scans natively on its own runner (no QEMU)
  # and pushes an untagged per-architecture image; merge joins them by digest
  # and applies the only tags: latest and <sha>-<date>.
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      BUILD_ARGS: |
        CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      # Build and Trivy gate only; the push below reuses the build cache.
      - uses: abxst/actions/strict@v3
        id: build
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: false
          platforms: linux/${{ matrix.platform.arch }}
          scan-platform: linux/${{ matrix.platform.arch }}
          build-args: ${{ env.BUILD_ARGS }}

      - name: Push by digest
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ steps.build.outputs.image-name-lc }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha

      - name: Export digest
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: steps.push.outputs.digest != ''
        with:
          name: digests-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          image="${NAME,,}"
          tags=("${image}:${GITHUB_SHA::7}-$(date -u +%d%m%Y)" "${image}:latest")
          sources=()
          for file in digests/*; do
            sources+=("${image}@sha256:${file##*/}")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@v0

      - name: Sign image and attest SBOM
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          platform_digests="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -r '.manifests[] | select(.platform.os == "linux") | .digest')"
          for digest in ${platform_digests}; do
            syft "${IMAGE}@${digest}" -o spdx-json=sbom.spdx.json
            cosign attest --yes \
              --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${digest}"
            cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${digest}"
          done
          cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
